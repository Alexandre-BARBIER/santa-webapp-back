<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Awesome Santa WebApp</title>
        <style>
            body { font-family: sans-serif; margin: 1em; }
            .table-wrapper { overflow-x: auto; }
            table { border-collapse: collapse; }
            th, td { border: 1px solid #888; padding: 0.4em 0.8em; text-align: left; overflow-wrap: anywhere; }
        </style>
    </head>
    <body>
        <h1>Database content</h1>
        <div class="table-wrapper">
        <table>
            <tr>
                <th> Id </th>
                <th> Destination url </th>
                <th> Public link </th>
                <th> Private link </th>
                <th> Nb clicks </th>
            </tr>
            {% for value in records %}
                <tr>
                    <th> {{ value.id }} </th>
                    <th> {{ value.dest_url }} </th>
                    <td> {{ value.public_link }} </td>
                    <td> {{ value.private_link }} </td>
                    <td> {{ value.nb_click }} </td>
                </tr>
            {% endfor %}
        </table>
        </div>

    </body>
</html>
